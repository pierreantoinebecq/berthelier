services:
  app:
    build: .
    container_name: luxury_app
    ports:
      - "8888:8888"
    volumes:
      - .:/app                        # Live code reloading
      - ./secrets:/secrets:ro         # Mount secrets read-only
    environment:
      # 🔑 This tells Google Cloud libraries where to find the key
      - GOOGLE_APPLICATION_CREDENTIALS=/secrets/gcp-key.json
      - PROJECT_ID=${PROJECT_ID}   
      - DATASET_ID=${DATASET_ID}
    command: tail -f /dev/null        # Keeps container running so you can enter it